<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roy — Business Card</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: var(--card);
      border-radius: 1.5rem;
      padding: 2.5rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      text-align: center;
      border: 1px solid rgba(56,189,248,0.15);
    }
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #818cf8);
      margin: 0 auto 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      font-weight: 700;
      color: #0f172a;
    }
    h1 { font-size: 1.75rem; margin-bottom: 0.25rem; }
    .role { color: var(--accent); font-weight: 600; margin-bottom: 1rem; }
    .bio { color: var(--muted); line-height: 1.6; margin-bottom: 1.75rem; }
    .contacts { display: flex; flex-direction: column; gap: 0.75rem; }
    .contacts a {
      display: block;
      padding: 0.85rem 1.25rem;
      background: rgba(56,189,248,0.1);
      border: 1px solid rgba(56,189,248,0.25);
      border-radius: 0.75rem;
      color: var(--text);
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .contacts a:hover {
      background: rgba(56,189,248,0.2);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">R</div>
    <h1>Roy</h1>
    <p class="role">Developer &amp; Creator</p>
    <p class="bio">Делаю небольшие сайты и экспериментирую с новыми технологиями. Люблю чистый код и понятные интерфейсы.</p>
    <div class="contacts">
      <a href="mailto:hello@example.com">hello@example.com</a>
      <a href="https://github.com/jagorun" target="_blank" rel="noopener">GitHub</a>
    </div>
  </div>
</body>
</html>
