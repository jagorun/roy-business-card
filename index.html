<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roy — визитка</title>
  <style>
    :root {
      --bg: #0b0f14;
      --card: #121826;
      --accent: #4f8cff;
      --text: #e6edf3;
      --muted: #8b949e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 20% 20%, #1a2233, var(--bg));
      color: var(--text);
    }
    .card {
      width: min(420px, 92vw);
      padding: 2.5rem 2rem;
      border-radius: 20px;
      background: linear-gradient(160deg, rgba(79,140,255,0.12), transparent 60%), var(--card);
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
      text-align: center;
    }
    .avatar {
      width: 88px; height: 88px; border-radius: 50%;
      margin: 0 auto 1rem;
      background: linear-gradient(135deg, var(--accent), #7c5cff);
      display: grid; place-items: center;
      font-size: 2rem; font-weight: 700; color: #fff;
    }
    h1 { margin: 0 0 .25rem; font-size: 1.5rem; }
    .role { color: var(--accent); font-weight: 600; margin-bottom: 1rem; }
    p { color: var(--muted); line-height: 1.6; margin: 0 0 1.5rem; }
    .contacts { display: flex; flex-direction: column; gap: .6rem; }
    .contacts a {
      color: var(--text); text-decoration: none;
      padding: .7rem 1rem; border-radius: 12px;
      background: rgba(255,255,255,0.04);
      transition: background .2s, transform .2s;
    }
    .contacts a:hover { background: rgba(79,140,255,0.18); transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">R</div>
    <h1>Roy</h1>
    <div class="role">Разработчик</div>
    <p>Делаю веб-сайты и приложения. От идеи до деплоя — всё в одних руках.</p>
    <div class="contacts">
      <a href="mailto:roy@example.com">Электронная почта</a>
      <a href="https://github.com/jagorun" target="_blank" rel="noopener">GitHub</a>
    </div>
  </div>
</body>
</html>
