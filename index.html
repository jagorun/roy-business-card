<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <link rel="icon" href="favicon.png" type="image/png">

<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-orb a" aria-hidden="true"></div>

  <div class="wrap">
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Moto — на главную">
        <img class="brand-logo" src="logo.jpg" width="40" height="40" alt="Moto">
        <span class="brand-name">Moto</span>
      </a>
      <nav class="nav" aria-label="Разделы">
        <a class="active" href="index.html" aria-current="page">О себе</a>
        <a href="index.html#aphorisms">Афоризмы</a>
        <a href="poems.html">Стихи</a>
      </nav>
    </header>

    <header class="hero" id="about">
      <div class="avatar"><img src="logo.jpg" width="100" height="100" alt="Логотип Moto"></div>
      <h1>Moto</h1>
      <p class="role">Developer &amp; Creator</p>
      <p class="bio">Экспериментирую с новыми технологиями. Люблю чистый код и понятные интерфейсы.</p>
      <div class="contacts">
        <a href="mailto: mov_mail@mail.ru">mov_mail@mail.ru</a>
        <a href="https://github.com/jagorun" target="_blank" rel="noopener noreferrer">GitHub</a>
      </div>
    </header>

    <section id="aphorisms" aria-labelledby="aphorisms-title">
      <div class="section-head">
        <h2 id="aphorisms-title">Афоризмы</h2>
        <button type="button" class="ghost-btn" data-reshuffle title="Другая случайная подборка">другая подборка</button>
      </div>

      <div class="carousel" data-carousel aria-live="polite">
        <div class="progress" data-carousel-progress aria-hidden="true"></div>
        <div class="spark-layer" data-spark aria-hidden="true"></div>
        <div class="carousel-track" data-carousel-track>
          <div class="carousel-item is-active" data-carousel-item>
            <blockquote><p>Загрузка…</p></blockquote>
          </div>
        </div>
        <div class="carousel-controls">
          <button type="button" class="carousel-btn" data-carousel-prev aria-label="Предыдущий">‹</button>
          <div class="dots" data-carousel-dots></div>
          <button type="button" class="carousel-btn" data-carousel-next aria-label="Следующий">›</button>
        </div>
      </div>
    </section>

    <section id="poems-preview" aria-labelledby="poems-preview-title">
      <div class="section-head">
        <h2 id="poems-preview-title">Стихи</h2>
      </div>
      <div class="teaser">
        <strong>Отдельная страница</strong>
        <a href="poems.html">Открыть стихи</a>
      </div>
    </section>

    <footer class="site">
      
    </footer>

  <script src="app.js" defer></script>
